<label>
  <input
    type="checkbox"
    [checked]="task().isComplete"
    (change)="toggled.emit(task().id)"
    [attr.aria-label]="'Mark ' + task().title + ' as ' + (task().isComplete ? 'incomplete' : 'complete')"
  />
  <span>{{ task().title }}</span>
</label>
<button
  class="btn btn-danger"
  type="button"
  (click)="removed.emit(task().id)"
  [attr.aria-label]="'Delete ' + task().title"
>
  Delete
</button>
